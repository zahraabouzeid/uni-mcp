name: Release

# Publishes the version in Cargo.toml once: when a new version number reaches
# main, or when the workflow is started by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/unimcp

jobs:
  version:
    name: Version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      unreleased: ${{ steps.version.outputs.unreleased }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "uni-mcp") | .version')
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "unreleased=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag is already released. Change the version in Cargo.toml to release again."
          else
            echo "unreleased=true" >> "$GITHUB_OUTPUT"
          fi

  web:
    name: Dashboard
    needs: version
    if: needs.version.outputs.unreleased == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: web/out

  build:
    name: Build (${{ matrix.asset }})
    needs: [version, web]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            binary: unimcp.exe
            asset: unimcp-windows-x64.exe
            installer: unimcp-windows-x64.msi
          - os: ubuntu-latest
            binary: unimcp
            asset: unimcp-linux-x64
          - os: macos-latest
            binary: unimcp
            asset: unimcp-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dashboard
          path: web/out
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: cp target/release/${{ matrix.binary }} ${{ matrix.asset }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - name: Installer
        if: matrix.installer
        shell: pwsh
        env:
          TAG: ${{ needs.version.outputs.tag }}
          WIX_URL: https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip
          WIX_SHA256: 6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31
        run: |
          curl.exe --fail --silent --show-error --location --output wix.zip $env:WIX_URL
          if ((Get-FileHash wix.zip -Algorithm SHA256).Hash -ne $env:WIX_SHA256) { throw "unexpected WiX download" }
          Expand-Archive wix.zip wix
          wix\candle.exe -nologo -arch x64 "-dVersion=$($env:TAG.TrimStart('v'))" "-dBinary=target\release\${{ matrix.binary }}" "-dIcon=crates\uni-mcp\assets\unimcp.ico" -out installer.wixobj crates\uni-mcp\wix\main.wxs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          wix\light.exe -nologo -sw1076 -out ${{ matrix.installer }} installer.wixobj
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: matrix.installer
        with:
          name: ${{ matrix.installer }}
          path: ${{ matrix.installer }}

  image:
    name: Image (${{ matrix.arch }})
    needs: version
    if: needs.version.outputs.unreleased == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - run: mkdir digests && touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*

  manifest:
    name: Image
    needs: [version, image]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - working-directory: digests
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          version=${TAG#v}
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$IMAGE:$version" --tag "$IMAGE:${version%.*}" --tag "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)

  publish:
    name: Publish
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: unimcp-*
          merge-multiple: true
          path: binaries
      # Creates the tag on the commit that was built.
      - run: >
          gh release create "$TAG" binaries/*
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
