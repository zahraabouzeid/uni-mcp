[package]
name = "uni-mcp"
description = "Read-only MCP server that connects AI apps to your university (courses, files, timetable)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "unimcp"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64.workspace = true
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
getrandom = "0.4"
include_dir.workspace = true
mime_guess = "2"
open = "5"
reqwest.workspace = true
rmcp = { version = "3", features = ["server", "macros", "transport-io"] }
rpassword = "7"
schemars = "1"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "signal", "time"] }
toml.workspace = true
uni-core.workspace = true
uni-ical.workspace = true
uni-moodle.workspace = true
uni-webdav.workspace = true

[dev-dependencies]
md5.workspace = true
tower = { version = "0.5", features = ["util"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[lints]
workspace = true
