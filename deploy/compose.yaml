x-unimcp: &unimcp
  restart: unless-stopped
  environment: &environment
    UNIMCP_BEHIND_PROXY: "true"
  expose:
    - "8787"
    - "8788"
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  app:
    <<: *unimcp
    image: ghcr.io/zahraabouzeid/unimcp:latest
    environment:
      <<: *environment
      UNIMCP_PUBLIC_URL: https://${DOMAIN:?set DOMAIN in .env}
      UNIMCP_ADMIN_URL: https://admin.${DOMAIN:?set DOMAIN in .env}
    volumes:
      - data:/data

  app-dev:
    <<: *unimcp
    image: ghcr.io/zahraabouzeid/unimcp:edge
    profiles:
      - dev
    environment:
      <<: *environment
      UNIMCP_PUBLIC_URL: https://dev.${DOMAIN:?set DOMAIN in .env}
      UNIMCP_ADMIN_URL: https://admin.dev.${DOMAIN:?set DOMAIN in .env}
    volumes:
      - data_dev:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  data:
  data_dev:
  caddy_data:
  caddy_config:
